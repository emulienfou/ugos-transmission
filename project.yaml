spec_version: "2.1"
app_id: com.davidsanchez.transmission
version: 4.1.4
support_arch:
  - amd64
product_series:
  - nasync
is_docker_app: true
port: 9091
open_type: tab
tag_types:
  - download
depend_fw_version: 1.13.0.0000
depend_docker_version: 1.7.0.0000
i18n:
  en-US:
    name: Transmission
    description: Fast, easy and free BitTorrent client with a web interface
    author: David Sanchez
    official: https://transmissionbt.com/
parameters:
  - key: DOWNLOAD_DIR
    type: path
    required: true
    i18n:
      en-US:
        name: Download folder
        description: Shared folder where Transmission saves downloads
  - key: PUID
    type: number
    required: true
    i18n:
      en-US:
        name: User ID (PUID)
        description: UID that owns downloaded files. Run "id" over SSH to find it (often 1000)
  - key: PGID
    type: number
    required: true
    i18n:
      en-US:
        name: Group ID (PGID)
        description: GID that owns downloaded files. Run "id" over SSH to find it (often 10 or 100)
  - key: RPC_USER
    type: string
    i18n:
      en-US:
        name: Web UI username
        description: Leave empty to disable web UI login
  - key: RPC_PASS
    type: password
    i18n:
      en-US:
        name: Web UI password
        description: Leave empty to disable web UI login
