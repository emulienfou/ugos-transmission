# Front proxy for Transmission for UGOS (see s6/svc-ug-proxy/run).
worker_processes 1;
pid /tmp/ug-nginx.pid;
error_log stderr warn;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_max_body_size 100m;
  client_body_temp_path /tmp/ug-nginx-body;
  proxy_temp_path /tmp/ug-nginx-proxy;
  fastcgi_temp_path /tmp/ug-nginx-fastcgi;
  uwsgi_temp_path /tmp/ug-nginx-uwsgi;
  scgi_temp_path /tmp/ug-nginx-scgi;

  server {
    listen 9091;
    listen [::]:9091;

    location = / { return 302 /transmission/web/; }
    location = /transmission/web { return 302 /transmission/web/; }

    # Web UI: static files, no login (the UI asks for consent, then signs in).
    location /transmission/web/ {
      alias /ui/;
      index index.html;
      add_header Cache-Control "no-cache";
    }

    # RPC for the web UI: hide the Basic-auth challenge so the browser doesn't
    # show its own login box; the UI shows its own sign-in dialog instead.
    location = /transmission/ug-rpc {
      proxy_pass http://127.0.0.1:9092/transmission/rpc;
      proxy_set_header Host $host;
      proxy_hide_header WWW-Authenticate;
      proxy_read_timeout 300s;
    }

    # Everything else (RPC for Sonarr, Radarr and other clients) is passed
    # through unchanged, including the normal login challenge.
    location / {
      proxy_pass http://127.0.0.1:9092;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
  }
}
