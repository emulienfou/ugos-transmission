services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4-r0-ls370
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${RPC_USER}
      - PASS=${RPC_PASS}
      - PEERPORT=51413
    volumes:
      - ./config:/config
      - ${DOWNLOAD_DIR}:/downloads
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    networks:
      - transmission

networks:
  transmission:
    driver: bridge
