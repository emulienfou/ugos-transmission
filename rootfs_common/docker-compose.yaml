services:
  transmission:
    image: davidsanchez/transmission:4.1.4-r0-ls371-ug2
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - USER=${RPC_USER}
      - PASS=${RPC_PASS}
      - PEERPORT=51413
      - UMASK=002
      - TRANSMISSION_WEB_HOME=/ui
    volumes:
      - ./config:/config
      - ${DOWNLOAD_DIR}:/downloads
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    networks:
      - transmission

networks:
  transmission:
    driver: bridge
